services:
  - type: web
    name: agri-vision-ai-api
    env: python
    buildCommand: pip install -r requirements-prod.txt
    startCommand: uvicorn src.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://agri-vision-ai-ashy.vercel.app

  - type: web
    name: agri-vision-ai-frontend
    env: node
    rootDir: frontend
    buildCommand: next build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://agri-vision-ai-ci07.onrender.com
